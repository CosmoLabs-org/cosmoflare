<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet">
  <!-- CosmoLabs Ops · Cosmoflare mark v2: a bold "C" (CosmoLabs) whose open end
       holds a heartbeat-style pulse — the ops signal the C monitors. Dark-first
       (bg #1a1a1a), amber #f59e0b primary, one cool secondary #7dd3fc detail.
       No text, no cloud, no bolt, no gradient. Geometry mirrors pager/src/logo.ts
       on a 32-grid scaled to ~62% of the 512 canvas. -->
  <rect width="512" height="512" fill="#1a1a1a"/>
  <g transform="translate(48 48) scale(13)">
    <path d="M 22.43 8.34 A 10 10 0 1 0 22.43 23.66" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <path d="M 17.5 16 L 21.5 16 L 25 12.75 L 26 19.75 L 27.5 15.5 L 28 15.5" fill="none" stroke="#7dd3fc" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

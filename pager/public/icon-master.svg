<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- CosmoLabs Ops · Cosmoflare mark: a bold "C" (CosmoLabs) whose open end
       holds an upward pulse caret — the ops signal the C monitors. Dark-first
       (bg #1a1a1a), amber #f59e0b primary, one cool secondary #7dd3fc detail.
       No text, no cloud, no bolt, no gradient. Geometry mirrors
       pager/src/logo.ts on a 32-grid scaled to ~62% of the 512 canvas. -->
  <rect width="512" height="512" fill="#1a1a1a"/>
  <g transform="translate(48 48) scale(13)">
    <path d="M 23.07 9.07 A 10 10 0 1 0 23.07 23.07" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 20.5 18.5 L 23.5 14.5 L 26.5 18.5" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

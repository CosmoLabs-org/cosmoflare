        VersionUpload(ctx, worker string, script io.Reader, opts ...WorkerOption) (*WorkerVersion, error)   // POST .../versions, multipart not needed: JSON {script, bindings, compatibility_date} matching Deploy's option set
        VersionList(ctx, worker string) ([]WorkerVersion, error)                                            // GET .../versions
        VersionGet(ctx, worker, versionID string) (*WorkerVersion, error)                                    // GET .../versions/{id}
        VersionDeploy(ctx, worker, versionID string) (*WorkerDeployment, error)                              // PUT .../deployments body {"version_id": id}
        VersionDelete(ctx, worker, versionID string) error                                                    // DELETE .../versions/{id}
        VersionRollback(ctx, worker, versionID string) (*WorkerDeployment, error)                            // = VersionDeploy; callers label it rollback


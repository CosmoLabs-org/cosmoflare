- task: |
    Create pkg/cosmoflare/worker_versions.go + worker_versions_test.go and
    cmd/worker_versions.go + cmd/worker_versions_run_test.go implementing
    script VERSIONS via raw REST (cloudflare-go v0.116 has NO versions API).

    Step 1 — extend WorkerService minimally IN pkg/cosmoflare/worker.go
    (this is the ONLY edit to worker.go):
      - add unexported fields to WorkerService: apiToken string; apiBaseURL string
      - in NewWorkerServiceFromCreds: set apiToken = apiToken and
        apiBaseURL = "https://api.cloudflare.com/client/v4" before returning
      - NewWorkerService stays unchanged (zero token)
    Step 2 — pkg/cosmoflare/worker_versions.go:

      func (s *WorkerService) rawRequest(ctx context.Context, method, path string, body any, out any) error
        - returns validationError("rawRequest", "raw API requires credentials-based construction (NewWorkerServiceFromCreds)") when s.apiToken == ""
        - http.Client{Timeout: 30s}; URL = s.apiBaseURL + path
        - Authorization: Bearer s.apiToken; Content-Type: application/json
        - non-2xx or CF envelope success:false -> newError with the envelope message
        - 2xx with out != nil -> json.Unmarshal of the envelope "result" field into out

      Types:
        type WorkerVersion struct { ID string `json:"id"`; Number int `json:"number"`; CreatedAt time.Time `json:"created_at"`; Source string `json:"source,omitempty"` }
        type WorkerDeployment struct { ID string `json:"id"`; CreatedAt time.Time `json:"created_at"`; VersionID string `json:"version_id"`; Source string `json:"source,omitempty"`; AuthorEmail string `json:"author_email,omitempty"` }


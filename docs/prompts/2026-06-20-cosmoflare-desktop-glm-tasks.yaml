- task: |
    Create the cosmoflare serve daemon skeleton (P-01 in the plan).

    Files to create:
      internal/server/server.go, internal/server/server_test.go, cmd/serve.go

    internal/server/server.go must provide:
      type Config struct { Token string; Version string }
      type Server struct { ... }                 // holds cfg + an atomic.Bool cfOnline
      func New(cfg Config) *Server
      func (s *Server) SetCloudflareOnline(ok bool)
      func (s *Server) Handler() http.Handler     // mux wrapped in token-auth middleware
    Routes: GET /healthz → JSON {systems_online:true, cloudflare_online:<bool>, version}.
    Auth middleware: require header `Authorization: Bearer <cfg.Token>`, else 401.

    cmd/serve.go: a cobra command mirroring cmd/mcp.go. Generate a random token
    (or --token), net.Listen "tcp" on --addr (default 127.0.0.1:0), print ONE JSON
    handshake line to stdout: {"addr":"127.0.0.1:<actual-port>","token":"<token>"},
    then http.Serve. Handle SIGINT/SIGTERM graceful shutdown.

    REQUIRED: add "serve" to the skipValidation slice in cmd/root.go — otherwise its
    PersistentPreRun calls os.Exit(1) on missing credentials BEFORE the handshake is
    printed, breaking the first-run flow. The daemon must start without valid creds
    (it reports cloudflare_online=false instead of exiting).

    Keychain: call os.Setenv("COSMOFLARE_NO_KEYCHAIN", "1") in RunE before any config/
    keychain use — the env var is the ONLY gate (internal/keychain/keychain.go reads it);
    there is NO --no-keychain flag. Read credentials from the config flow, never the OS keychain.

    The exact reference test + implementation are in the plan (Task 1). Follow them.

    Testability: the auth check belongs in `authMiddleware` — the test calls /healthz
    over httptest with and without the bearer token; do NOT re-implement the token
    comparison inside the test.

    Verify:
      GOWORK=off go test ./internal/server/ -run TestHealthz_RequiresToken -v
      GOWORK=off go build ./... && go vet ./internal/server/
    Commit via: ccs commit-batch --message "feat(serve): add cosmoflare serve daemon skeleton with token auth + /healthz (P-01)"
  files:
    - internal/server/server.go
    - internal/server/server_test.go
    - cmd/serve.go
    - cmd/root.go
  context_files:
    - docs/planning-mode/2026-06-20-cosmoflare-desktop.md
    - cmd/mcp.go
    - cmd/root.go
    - internal/keychain/keychain.go
  max_turns: 25
  verify: "GOWORK=off go test ./internal/server/ -run TestHealthz_RequiresToken -v && GOWORK=off go build ./..."

# Sequential after P-01 (same package + modifies server.go). Do NOT batch with the task above.
- task: |
    Add REST read endpoints to the serve daemon (P-02 in the plan).

    Files: create internal/server/rest.go + internal/server/rest_test.go; modify
    internal/server/server.go (register routes).

    Define a NEW daemon-local interface named ServeSource in rest.go (do NOT call it
    DataSource and do NOT import internal/tui.DataSource — that interface is R2-only,
    FetchBuckets/FetchObjects/FetchMetrics, and does NOT fit):
      type ServeSource interface {
        Accounts() ([]map[string]any, error)
        Zones() ([]map[string]any, error)
        R2Buckets() ([]map[string]any, error)
        Workers() ([]map[string]any, error)
        KV() ([]map[string]any, error)
      }
    Add (s *Server) SetData(ServeSource). Register GET /accounts /zones /r2/buckets
    /workers /kv — each calls the matching method and writes JSON. On error → HTTP 502
    and s.SetCloudflareOnline(false); on success → s.SetCloudflareOnline(true).

    In cmd/serve.go, implement ServeSource with the VERIFIED constructors (do NOT
    invent New*FromCreds by analogy):
      Zones()    -> cosmoflare.NewZoneServiceFromCreds(AccountID, APIToken).List(ctx, ...)
      Workers()  -> cosmoflare.NewWorkerServiceFromCreds(AccountID, APIToken)
      KV()       -> cosmoflare.NewKVServiceFromCreds(AccountID, APIToken)
      R2Buckets()-> cosmoflare.NewClient(cosmoflare.WithAccountID(AccountID), cosmoflare.WithAPIToken(APIToken)).ListBuckets(ctx)   # there is NO NewR2ServiceFromCreds
      Accounts() -> config ConfigManager.ListProfiles()  # local profiles, NOT a CF API call

    The reference test + impl are in the plan (Task 2). Follow them.

    Testability: tests inject a fake DataSource (no live credentials) and assert the
    JSON body — do NOT call the real Cloudflare API in tests.

    Verify:
      GOWORK=off go test ./internal/server/ -run TestZonesEndpoint -v
      GOWORK=off go build ./...
    Commit via: ccs commit-batch --message "feat(serve): add REST read endpoints over existing services (P-02)"

title: CF governance pillar — Cosmoflare as CosmoLabs meta-project for Cloudflare auditing, security, efficiency
description: 'Charter from owner directive 2026-10-08 (FB-12, via Churches-app): Cosmoflare is the CosmoLabs meta-project for Cloudflare workflows across all projects (Churches-app, Noble.Coffee, BaristaBase, AXO, BeeKey, future). Three duties: (1) audit CF infrastructure for efficiency and security, (2) prevent wasted resources, (3) own the CF best-practice standards every project follows. Every new standard lands as a cosmoflare audit rule first. Children: FEAT-050 pre-launch verdict command (success metric), FEAT-049 caching dimension (rule set 1), ROAD-101 usage-waste program (detection substrate). Future dimensions: security audit (WAF/firewall posture, token scope), cost audit (D1 rows-read/write, KV op waste, Pages vs Workers fit), compliance sweep (CORS, no cache on user-scoped routes). Sibling deliveries outside this repo: CosmoKit cf-cache module, ClaudeCodeSetup CF efficiency SOP + cf-audit skill.'

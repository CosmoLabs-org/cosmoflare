title: 'dns update: --content flag documented in help but not implemented'
description: cosmoflare dns update's own help (cmd/dns.go:34,105) and docs/USAGE.md:727-728 show 'dns update ZONE_ID RECORD_ID --content=5.6.7.8' but the command registers only --comment/--priority/--proxied/--ttl — a record's content cannot be changed via the CLI despite the docs promising it. Found by doc-lint at session-end 2026-10-15. USAGE.md examples corrected to real-flag forms; the command help and (ideally) the missing --content flag remain.
fix_direction: Add dnsContent flag to dnsUpdateCmd (mirror dnsCreateCmd's --content wiring into the update payload), or strip the flag from both help examples until implemented.
affected_files:
    - cmd/dns.go
    - docs/USAGE.md
resolution:
    notes: 'Fixed via _glm-agent-0459 worktree (merge 27f7d18): WithDNSUpdateContent library option (distinct from the list-filter WithDNSContent), --content flag on dns update with Changed() partial-update wiring, no-flags error message updated, USAGE.md workaround note removed and content examples restored. Full cmd+pkg suites green; TestDNSUpdateContent asserts the PATCH body carries the content key.'

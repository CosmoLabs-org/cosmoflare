title: 'Auth modernization: token retrieval command + device-flow login'
description: 'Two auth upgrades citing live changelogs (see docs/research/2026-09-10-cf-limits-corpus/qwen-results-docs-references.md): (1) cosmoflare auth token — print/redact-safe retrieval of current credentials for use by other tools (wrangler shipped wrangler auth token 2025-12-18); (2) auth login --device — OAuth 2.0 Device Authorization Grant, no local callback server (wrangler shipped 2026-08-04). Fits the FEAT-017 first-run wizard flow. Security-sensitive: token output must respect the credentials store redaction conventions (never print secrets unless explicitly requested with a flag).'
acceptance_criteria:
    - criterion: auth token emits the current token per store conventions with explicit consent flag;auth login --device completes the device flow and stores credentials;both have --json and rich help
      met: false
resolution:
    notes: 'Part 2 DEFERRED by operator (2026-09-17): OQ-1 research (docs/research/2026-09-17-feat029-device-flow-oq1.md) shows the device grant is first-party only — third-party clients are authorization-code only, so ''register own client'' is infeasible and wrangler client_id reuse was declined. Part 1 (auth token) shipped in v0.28.2+. Revisit if Cloudflare opens the device grant to third-party clients; the verified endpoint/poll/refresh contract is preserved in the research note, so implementation is spec-ready the day policy changes.'

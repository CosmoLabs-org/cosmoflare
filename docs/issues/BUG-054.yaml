title: Evaluator cooldown keyed on rule name silences second offender of fan-out conditions
description: Fan-out conditions (worker-cpu, worker-errors, do-cpu, …; FEAT-047) fire once per offending scope instance, but Evaluator.lastFired and fires were keyed on rule.Name. The first offender in a cycle set the cooldown, so every other offender breaching the same rule in that cycle was silently skipped — two stuck Workers paged as one. Alert.Count also mixed counts across scopes.
fix_direction: Key lastFired and fires on the per-scope alert ID (rule name for account scope, rule/scope for fan-out). Account-scope behavior is unchanged because alertID == rule.Name there.

title: First-run setup wizard — one token, whole platform
description: |-
    # First-run setup wizard — one token, whole platform

    From the MCP discussion: cosmoflare needs zero MCP and zero multi-step config — one API token covers REST + R2 S3 endpoints. Make that frictionless: 'cosmoflare setup' (or extend 'account') runs a wizard — ask/validate token, resolve account ID, verify with TestConnection, write .cosmoflare.yaml, offer doctor check — done in under a minute. Success bar: a new user goes from install to 'cosmoflare status' showing live account state with ONE command and ONE credential. Why: the official cf CLI + MCP stack needs plugin installs, OAuth per server, and restarts; our moat is exactly this simplicity.

    ## Additional context

    One token, whole platform: 'cosmoflare setup' wizard — ask/validate token, resolve account ID, verify with TestConnection, write .cosmoflare.yaml, offer doctor check — under a minute from install to 'cosmoflare status' showing live account state. Zero MCP installs, zero OAuth per server, zero restarts (the official cf CLI + MCP stack needs all three) — this simplicity is the moat. Extends the account command family; onboarding + ux tags.
resolution:
    notes: 'Closed 2026-09-18 after scope verification: the wizard itself already existed (cmd/setup.go — token validation, account auto-detect, TestConnection, profile write, quiet mode). The two real gaps vs the acceptance bar are now closed: (1) the wizard''s success step points at `cosmoflare status` (live state) and `cosmoflare doctor` (health check); (2) bare `cosmoflare` with no credential store appends a first-run nudge toward setup — install to live state is now one command and one credential end to end. Tests pin both behaviors, including the no-nag-when-configured case.'

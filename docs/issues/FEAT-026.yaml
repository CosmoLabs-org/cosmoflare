title: Named environment profiles (dev/staging/prod) across all commands
description: 'Wrangler''s environments pattern, generalized: named profiles in .cosmoflare.yaml (staging/prod/dev) that scope every command — resource suffixing, separate D1/KV/R2 bindings, local-vs-remote execution context (D1 execute --local|--remote, Workers dev vs deploy). Justification: Qwen command-surface corpus section 10 item 8 (environment awareness) + D1 security corpus section 3 (explicit dev/staging/prod DB separation as a security practice). Today every command is environment-blind; MyCarGuide''s parity checks (FEAT-018) are manual partly because of this. Design: --env <name> flag convention, profiles section in config, per-profile plan tier for the limits layer (ties to brainstorm D2 per-service plan resolution).'
acceptance_criteria:
    - criterion: --env flag resolves a named profile across at least d1
      met: false
    - criterion: kv
      met: false
    - criterion: r2
      met: false
    - criterion: workers command groups;d1 execute supports --local and --remote against the active profile;limits command reports the active profile's plan tier;config validation errors on unknown --env
      met: false
resolution:
    notes: 'Closed 2026-09-17: parts 1-3 shipped. --env resolves named profiles across d1/kv/r2/workers + all sub-resource name surfaces (bucket domain/lifecycle/notifications/policy, worker secrets/versions/bindings/cron/tail/types/deployments/routes/domains/subdomain, sync/watch); d1 execute --local/--remote with per-env SQLite state; limits reports profile plan tier; unknown --env errors with known-profiles listing; dev uses the single global --env selector (operator decision). Remaining d1/kv ID-taking commands are out of scope by the ID rule.'
    resolved_at: 2026-09-17T20:03:53.653209+04:00

title: 'Rate-limit-aware shared client: Retry-After, backoff, retry flags'
description: 'Every API call respects Cloudflare rate-limit semantics: inspect Retry-After and Ratelimit/Ratelimit-Policy headers, exponential backoff with jitter, never hammer on 429. Per-service awareness: global 1,200/5min per token, 200 r/s per IP, GraphQL cost-based 320/5min, R2 REST 1,200/5min, KV 1 write/sec per key, Queues 5,000 msg/s per queue. CLI surface: --max-retries, --retry-backoff, --retry-budget on API-bound commands. Corpus section 6 (docs/research/2026-09-10-cf-limits-corpus/qwen-results-commands.md). Feeds limits-layer guards (brainstorm D4) and the command registry manifest (FEAT-020).'
acceptance_criteria:
    - criterion: 429 with Retry-After sleeps exactly that long once
      met: false
    - criterion: not N times;--max-retries=0 disables retries deterministically;per-service buckets documented in help;backoff has jitter
      met: false

    # Opt-in env-gated update check

    No growth instrumentation exists. Env-gated opt-in update check against GitHub Releases (default off). Evidence: agent-4-competitive.md

    ## Additional context

    Env-gated opt-in update check against GitHub Releases (default OFF; COSMOFLARE_UPDATE_CHECK=1 to enable). One-line stderr notice when a newer release exists; never blocks, never fails the command; 2s timeout; silent under --json unless a new version exists (then stderr note only, JSON payload untouched). No telemetry beyond the GitHub API request itself. Ships in the next minor release.


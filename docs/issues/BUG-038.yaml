title: No aria-live regions — real-time output silent to screen readers (WCAG 4.1.3)
description: No aria-live or role=status anywhere in desktop/src. SSE notifications prepend to the list (Notifications.tsx:63-74), the unread count changes (:47-49), and the connecting state swaps (App.tsx:146) — all silent to assistive tech. For a real-time monitoring dashboard this is a core-function failure for AT users. Found by audit agent-18.
fix_direction: Wrap the notification list in role="log" aria-live="polite"; role="status" on the unread badge and the connecting pane; add axe-core to the Vitest suite as a regression gate.
affected_files:
    - desktop/src/views/Notifications.tsx
    - desktop/src/App.tsx

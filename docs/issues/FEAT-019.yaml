title: Permission manifest + least-privilege token doctor
description: 'Model Cloudflare API token permissions as data: account-level families (29), zone-level (39), user-level (5), each with Read/Edit split, plus a per-command-group least-privilege matrix. Full tables in docs/research/2026-09-10-cf-limits-corpus/qwen-results-commands.md sections 3A.1-3A.4. Commands this enables: auth token create/list/verify/revoke, api permissions list/check, api roles list/assign/revoke (corpus section 5.21). Killer UX: ''token doctor'' — given a workflow (e.g. deploy+kv+r2), emit the minimal token scopes for it; given a token, verify scopes before first API call fails. Extends open FEAT-011 (permission names drift) — that issue tracks names, this tracks the manifest and tooling.'
acceptance_criteria:
    - criterion: Permission manifest exists as versioned data with source provenance;api permissions check <token> reports missing scopes for a given command group;token doctor emits minimal scope set for a named workflow;FEAT-011 names derive from the same manifest
      met: false

title: Data races in internal/interactive block CI and Release pipelines
description: 'go test -race ./internal/interactive/ fails (TestEncryptDecryptRoundtrip, TestEncryptEmptyData, TestDecryptWrongPassword, TestReadPasswordWithReader) — races fire across tests, indicating package-level shared state across 520 tests. The -race gate in ci.yml:55 and release.yml:31 fails every run: master CI red on all 7 recorded runs, release workflow 18/18 failed since March. Found by 2026-08-31 audit agent-5.'
fix_direction: Isolate the package-level mutable state (key cache/terminal state); guard with mutex or move to per-test instances so go test -race passes.
affected_files:
    - internal/interactive/

title: In-process event bus for real-time notifications (ROAD-080)
description: 'Implement ROAD-080: a standalone account-agnostic internal/events.Bus (pub/sub, non-blocking drop-on-full) that webhook.Manager.TriggerAlert publishes alerts to and the serve daemon subscribes to, forwarding events onto the SSE notifications channel so the Cosmoflare Desktop notifications panel is live. Closes the BR-07 gap. Scope: core bus only (live metrics IDEA-037 and the outbound sender are separate follow-ups). Design: docs/brainstorming/2026-06-21-inprocess-event-bus.md. Plan: docs/planning-mode/2026-06-21-inprocess-event-bus.md (4 TDD tasks). Prompt: docs/prompts/2026-06-21-inprocess-event-bus.md.'

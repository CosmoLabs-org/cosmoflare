title: In-process event bus for real-time notifications (ROAD-080)
description: 'RE-SCOPED 2026-09-05 per audit finding (agent-15 code-verified): the original standalone internal/events.Bus design is obsolete — the sseHub transport it assumed now SHIPPED with IDEA-037 (internal/server/sse.go: hub, multiplexed /events, Server.Publish; MetricsProducer wired; desktop React Query bridge live). What remains is the LAST MILE: webhook.Manager.TriggerAlert (internal/webhook/manager.go:182) currently does HTTP delivery only and publishes to no bus — the notifications channel''s only source is SetCloudflareOnline transitions (server.go:73-87), so alerts never reach the desktop panel. New scope: a thin bridge that publishes TriggerAlert events onto the existing sseHub notifications channel (subscribe API on the manager or a small adapter in internal/server), reusing the shipped hub''s drop-on-full semantics. Do NOT build a second bus. The original brainstorm/plan/prompt chain (2026-06-21-inprocess-event-bus) is marked ABANDONED — superseded by this re-scope; write a fresh short plan before implementing. Tracked in ROAD-084 (Desktop v1.1 reliability).'

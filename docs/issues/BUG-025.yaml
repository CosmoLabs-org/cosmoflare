title: Guardrails parsed and tested but never enforced anywhere
description: GuardrailChecker.CheckUpload (bucket allowlist, max_file_size, blocked_keys) has zero production callers — verified by grep across pkg/, cmd/, internal/. Neither client.Upload, apply, sync, nor watch invoke it. A user with blocked_keys:[.env] uploads .env to any bucket unimpeded — false sense of protection in the advertised agent-safety feature. Found by audit agent-2.
fix_direction: Call CheckUpload inside client.Upload/MultipartUpload (loaded from project config) or at minimum in cmd/sync.go and cmd/watch.go before each upload; fail when !result.Allowed. Default-exclude .git/, .env*, .DS_Store.
affected_files:
    - pkg/cosmoflare/guardrails.go:29

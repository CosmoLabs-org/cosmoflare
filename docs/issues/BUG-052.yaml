title: Emoji-named directory committed in v0.28.x tags poisons proxy.golang.org module zips
description: 'A directory named ''❓    TauriApp                             0001-01-01    0                   '' (Finder column-view paste) containing post.json is committed on master and tagged in v0.28.0/v0.28.1. proxy.golang.org rejects module zips whose paths contain the ❓ char (U+2753), so create-zip fails for both versions: ''not found: create zip: ... malformed file path ... invalid char''. Expected: go install github.com/CosmoLabs-org/cosmoflare@latest resolves the newest release and pkg.go.dev documents it. Actual: @latest pinned to v0.27.0, pkg.go.dev frozen at v0.27.0 showing the outdated ''Package r2go2'' doc, v0.28.0/v0.28.1 uninstallable via the Go module proxy. GitHub release archives and Homebrew unaffected (different distribution path). Proxy caches the zip-creation failure, so v0.28.0/v0.28.1 are permanently un-buildable; only a new clean version (v0.28.2) restores module distribution.'
reproduction_steps: |
    1. curl -s "https://proxy.golang.org/github.com/!cosmo!labs-org/cosmoflare/@v/v0.28.1.info"
    2. Observe: not found: create zip: ... malformed file path "❓    TauriApp ... /post.json": invalid char '❓'
    3. curl -s "https://proxy.golang.org/github.com/!cosmo!labs-org/cosmoflare/@latest" → still v0.27.0
    4. Local confirm: git -c core.quotepath=off ls-tree -r v0.28.1 --name-only | grep '❓' → 1 hit; v0.27.0 → 0 hits; HEAD → 1 hit
    Note: default core.quotepath quoting prints the name octal-escaped, so plain grep '❓' on ls-tree/log output silently misses it — scan with -c core.quotepath=off.
expected_behavior: Newest tag builds a proxy zip, @latest tracks it, pkg.go.dev documents the current package name
actual_behavior: proxy zip creation fails for v0.28.0/v0.28.1; @latest stuck on v0.27.0; pkg.go.dev shows outdated 'Package r2go2' doc; go install ...@v0.28.x fails
fix_direction: '1) git rm -r the emoji-named directory from master. 2) Add a sanity-gate check to ''make release'' that scans the tagged tree for non-ASCII/emoji paths and fails fast (red on v0.28.1 tree, green after rm). 3) Cut v0.28.2 — the only remedy for the poisoned versions. 4) Post-publish: request proxy @v endpoints and the pkg.go.dev page to trigger re-index; acceptance is landing text ''Package cosmoflare provides''.'
affected_files:
    - ❓    TauriApp                             0001-01-01    0                   /post.json
    - Makefile
resolution:
    notes: 'Fixed in b2d4eaf (emoji dir removed + release-gate path check), released as v0.28.2. Verified: proxy.golang.org serves v0.28.2 zip (HTTP 200, 0 non-ASCII paths), brew fetch checksum-validates, binary version stamp matches tag. pkg.go.dev re-index is display latency, tracked by G-01.'

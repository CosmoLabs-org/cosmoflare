resolution:
    lessons_learned: 'Inline ''??''-fallback closures built in component bodies are unstable effect deps: the injected-prop test seam is stable, the production fallback is not. Test every seam from both sides, and count real requests on the production path (request-budget E2E) — cache-absorbed loops hide on success paths and surface as outages on failure paths.'
revisions:
    - date: "2026-10-11T20:44:38.009396+04:00"
      action: closed
fix_evidence: |
    Fix commit a43e03b (merge 1fd77f4): module-level defaultFetchJson hoisted
    in all 9 views; fetcher ?? defaultFetchJson keeps the dep stable.
    Regression tests 'does not loop fetches when no fetcher prop is injected
    (production path)' in AIView.test.tsx and DomainsView.test.tsx measured
    1720 / 1203 spy calls before the fix, flat after. Suite 236/236 green.
    Deployed as worker version 30fa2042; post-deploy harness verification:
    request counts 8 / 1 / 0 per route in a 4s window (was 1500+).
    Full report: docs/bug-fixes/2026-10-11-pager-infinite-fetch-loop.md
root_cause: |
    Unstable object identity in a React effect dependency array. Each view built
    its fetch helper inline inside the component body:
      const fetchJson: ViewFetcher = fetcher ?? ((endpoint, opts) => api.fetchJson(endpoint, opts));
    A fresh closure exists per render, so the load effect's [.., fetchJson] dep
    compares unequal after EVERY render. Every fetch completion calls setState
    with a new result object, which re-renders, which rebuilds the closure,
    which re-fires the effect: a self-feeding loop at ~50 fetches/sec per open
    page. On success iterations the ApiClient 60s cache answers in-memory (no
    network); on ANY failure path (HTTP error, expired Access session) nothing
    caches, so every iteration is a real network request. iOS WebKit caps
    concurrent connections per host (~6); a failing endpoint's real-request
    storm saturates the pool and the page's primary load fetch never completes
    -> permanent skeleton. Present since the P-04..P-06 React rebuild (all
    views carried the pattern from their first commit).
session_ref: Session 2037 continuation (2026-10-11), operator live report; diagnosed via scratchpad harness + Playwright sweep, fixed by GLM agent 0401 through the S334 gate.

title: .dockerignore excludes go.mod/go.sum — Docker build fails at COPY
description: The ignore file's *.mod and *.sum patterns match the root go.mod/go.sum, so the Dockerfile dependency layer COPY go.mod go.sum ./ (Dockerfile:14) fails with not-found. Nobody noticed because no CI job builds the image; the docker-build Makefile target is dead on arrival. Found by 2026-08-31 audit agent-9.
fix_direction: Delete the *.mod/*.sum entries; add a CI job that runs docker build so image breakage is caught.

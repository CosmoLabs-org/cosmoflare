title: 'PWA offline app-shell: native-feel launches without network'
description: 'Phase 3 of ROAD-p2FSZR0 (mobile via PWA): today sw.js has NO fetch handler — every launch needs the network and shows Safari''s offline error, which breaks the ''native app'' feel. Add an app-shell cache strategy to the service worker: precache the hashed vite bundle + icons on install, serve shell cache-first with background revalidate, keep /api/* always network (real-numbers-only rule: cached API data only via the existing ApiClient sessionStorage layer with its age labels). Result: the home-screen app opens instantly and works offline for the last-viewed data, like an installed app. Respect the refresh-storm guard and never serve stale data without its age badge.'

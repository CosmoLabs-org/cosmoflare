title: CosmoLabs Ops PWA — private Cloudflare-hosted monitoring dashboard + push alerts for iPhone
description: 'Operator idea 2026-10-09: instead of waiting for the native iOS app or running alerts watch on a Mac, host a private PWA on Cloudflare that only the operator can open. Phase 1: Worker + static page behind Cloudflare Access (email login); the CF API token lives as a Worker secret (read-only scope); the page shows monthly usage pacing, zone cache miss/uncached volume and D1 rows read per database, reading the same GraphQL datasets verified in FEAT-049. Phase 2: a Cron Trigger evaluates the alert rules (zone-cache-miss-pct, zone-uncached-requests, d1-rows-read, usage pacing) with the hourly per-scope cooldown and sends Web Push to the installed PWA — monitoring with no Mac running. Decisions to settle: port the rule logic to TypeScript vs Go->Wasm; verify iOS home-screen Web Push and Cloudflare Access plan availability live; reuse pager/ (built, not deployed — cosmolabs.org/pager 404). Deploy needs an explicit operator go (local-only rule). Supersedes the ''pager PWA deploy + background watch'' path for the phone.'
resolution:
    notes: 'Phase 1 (dashboard behind Access, 30-day session, owner email only) and the pager pairing fixes are live at the workers.dev hostname (2026-10-09). Remaining: phone pairing + starter rules (push via alerts watch on the Mac), then Phase 2 cron + Web Push from the Worker.'

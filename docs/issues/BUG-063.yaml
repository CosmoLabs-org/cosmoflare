title: 'Cache-miss alert rides a tiny base: percentage alerts page without volume floor or absolute numbers'
description: 'The zone-cache-miss-pct starter rule (threshold 50%, judged above ZONE_CACHE_FLOOR=100 eligible) paged on statistically meaningless bases. Live evidence 2026-10-12: illuminate.am alerted at 50.4% miss on 139 eligible requests (62 misses+expired of 1944 total; 70% dynamic) and kept riding the line as the 24h window slid, paging nearly every cooldown. The alert also showed a bare percentage with no absolute base, so a page could not be judged without opening the dashboard.'
fix_direction: Alerting floor MISS_PCT_ELIGIBLE_FLOOR=1000 eligible/day for zone-cache-miss-pct in rules.ts conditionValues (under it the ratio is measured in the summary view but never pages); ZoneObs/ZoneRow carry the absolute misses count; Fire/AlertFeedEntry/push body carry a context line (N misses of M eligible requests) so ratios never travel without their base.

title: Command registry manifest — per-command metadata spine
description: 'Every CLI command described by a manifest entry: cli_path, wrangler_equivalent, service, verb, api_ops, required permissions (account/zone/user), limit catalog ids, local_checks, api_checks, rate_limit_behavior (429/Retry-After), danger_level, destructive, trackable. Schema in corpus section 4.1 (docs/research/2026-09-10-cf-limits-corpus/qwen-results-commands.md). This is the unifying spine: limits-layer guards (brainstorm D4) resolve limit ids per command, permission checks (FEAT-011 successor) resolve scopes per command, audit logs danger_level, dry-run defaults derive from destructive flag, and MCP tool generation (withered idea, ROAD-091 adjacent) derives descriptions. Declared once, consumed everywhere.'
acceptance_criteria:
    - criterion: Manifest schema defined and populated for all existing command groups;limits guard lookup resolves command->limit ids through the manifest;audit entries carry danger_level from the manifest
      met: false
resolution:
    notes: 'Wave 1 shipped 2026-09-18 (in-session): internal/cmdmanifest package — typed Go-source registry per corpus schema 4.1 (id/cli_path/wrangler/service/scope/verb/api_ops/permissions/limits/local+api checks/rate-limit/danger/destructive/trackable), r2 pilot group (12 commands: bucket lifecycle, object ops, sync up/down, watch), uniqueness+consistency tests (destructive⇒high danger enforced). First consumer live: r2 bucket delete stamps audit entries with manifest id + danger level via COSMOFLARE_AUDIT_LOG-overridable path; unregistered paths log manifest_id=unregistered so coverage gaps stay visible. Permissions pre-filled from the 2026-09-18 Qwen dataset (Workers R2 Storage). Next waves: remaining command groups, dry-run-default + MCP-description consumers.'

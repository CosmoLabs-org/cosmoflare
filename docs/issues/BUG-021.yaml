title: 7 test files reference removed packages (R2Go2 rebrand leftovers), break go test ./... compilation
description: 'After the CosmoDev-R2Go2 -> cosmoflare rebrand, 7 *_test.go files still import deleted packages: github.com/CosmoLabs-org/CosmoDev-R2Go2/internal/config, github.com/CosmoLabs-org/cosmoflare/pkg/r2go2, and github.com/CosmoLabs-org/cosmoflare/internal/api. These fail to compile under go test ./tests/... and go test ./pkg/cosmoflare/ and inflate the test-count claims. Confirmed via grep and LSP broken-import diagnostics. The prior session removed orphaned internal/api test files (1,495 lines) but missed these in tests/ and pkg/. Not compile-verified this session to avoid triggering integration-test keychain lookups, but the broken imports are definitive.'
actual_behavior: go test ./tests/... ./pkg/cosmoflare/ fails to compile due to no required module for deleted packages
fix_direction: Rewrite the 7 files against the current github.com/CosmoLabs-org/cosmoflare module paths, or delete irreducible integration stubs that have no current equivalent; verify with go build ./... then targeted go test on non-integration packages.

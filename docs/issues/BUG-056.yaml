title: Ops billing period assumed calendar month (ends Nov 1); the real cycle runs from the 23rd (Sep 23 - Oct 23)
description: The billing collector falls back to the UTC calendar month because GET /accounts/{id}/subscriptions, /user/subscriptions and /billing/profile all return 10000 Authentication error for the ops token (no Billing Read). The operator's Cloudflare dashboard shows Workers usage for Sep 23 - Oct 23, so period day/days, projections and overage USD were computed on the wrong window.
fix_direction: Set BILLING_ANCHOR_DAY=23 as a wrangler var now (period.source=anchor); later add Billing Read to the token so the period comes from the subscription.
affected_files:
    - apps/ops/src/billing.ts
    - apps/ops/wrangler.jsonc

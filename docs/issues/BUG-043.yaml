title: Multipart abort uses canceled context, orphaning billed uploads
description: pkg/cosmoflare/upload.go:181 and multipart.go:467 abort incomplete multipart uploads with the already-canceled request context, so the abort itself fails silently and billed parts leak (audit 2026-09-13, agent-2).
fix_direction: Use context.WithoutCancel(ctx) with a timeout for AbortMultipartUpload calls in pkg/cosmoflare/upload.go and multipart.go; log abort failures instead of discarding them

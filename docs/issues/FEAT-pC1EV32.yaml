title: Ops Commands-to-AI-Agent modal — deterministic per-domain advisory briefs, copy-paste ready for Claude Code / Codex / agentic sessions
description: 'Every domain with alerts or caching concerns gets an advisory in Ops. A ''Commands to AI Agent'' button opens a modal with a deterministic, copy-paste-ready message the operator sends to the project''s AI agent session (Claude Code, Codex, any harness — plain text, harness-neutral). Facts are Ops-measured only (zone cache coverage via httpRequests1dGroups, HTML-trap probe + Cache Rule count, firing alerts, rule-quota state); actions are CF config directives plus cosmoflare verify commands (no source-level advice — agents already know their project, they need direction). The message system is the core extensible artifact: a template architecture with message KINDS (error, optimization, quota, cache, ...), FORMAT targets (agent brief v1; future: slack, ticket), and SCOPE bindings (project / worker / zone / domain), designed so any new finding class plugs in with one template registration. Texts generated by cosmoflare deterministically — same state, byte-identical brief; no LLM inside the app. Operator directive 2026-10-15 session: ''brainplan this''. Related: FEAT-060 (domains view — the advisory''s surface), FEAT-067/068/070 (the rule sources the CLI already encodes), ROAD-104.'

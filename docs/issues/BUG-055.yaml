title: ZoneHTTP analytics query rejected live — count requested inside sum
description: AnalyticsService.ZoneHTTP asked for sum { count edgeResponseBytes visits } on httpRequestsAdaptiveGroups. The live schema (introspected 2026-10-08) has count on the group, not on ZoneHttpRequestsAdaptiveGroupsSum, so every zone failed with 'unknown field "count"' and cosmoflare metrics showed no zone traffic. The unit test mock mirrored the wrong shape, so the suite stayed green.
fix_direction: Request count at group level, read g.Count; test asserts count is never inside the sum block and the mock uses the live response shape.
affected_files:
    - pkg/cosmoflare/analytics.go
    - pkg/cosmoflare/analytics_test.go

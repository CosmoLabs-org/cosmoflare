title: All installer scripts download from dead repo — curl|bash returns 404
description: install.sh:19-20 sets REPO=CosmoLabs-org/CosmoDev-R2Go2 and BINARY_NAME=r2go2; download URL (install.sh:136) hits the nonexistent repo with wrong asset names (released assets are cosmoflare-OS-ARCH). Same in install.ps1:11-12 and install-menu.sh:159,178 (which also has a malformed API URL missing /repos/). Anyone running the documented install gets a 404. Found by audit agents 5 and 9.
fix_direction: Point all scripts at CosmoLabs-org/cosmoflare with cosmoflare asset names; add sha256 verification against checksums-sha256.txt before chmod +x.
affected_files:
    - install.sh
    - install.ps1
    - install-menu.sh

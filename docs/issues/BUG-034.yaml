title: --json mode prints nothing on configuration errors
description: PersistentPreRun validates the token then calls printError and os.Exit(1) (cmd/root.go:99-110); printError returns immediately when JSONOutput is true (root.go:197-202). So 'cosmoflare zone list --json' with a missing token prints NOTHING and exits 1 — breaking the documented OutputResponse agent contract and the project's own agent-readable-errors rule. Found by audit agent-7.
fix_direction: 'Branch on JSONOutput in PersistentPreRun and emit printErrorJSON before os.Exit(1). Add regression test: run a command with --json and no credentials, assert JSON error body on stdout.'
affected_files:
    - cmd/root.go

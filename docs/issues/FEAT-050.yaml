## Description

Charter success metric (owner directive 2026-10-08): any CosmoLabs project runs one cosmoflare command before launch and gets a pass/fail efficiency + security verdict. The command composes audit dimensions as rules: caching (FEAT-049, first rule set, reference Churches-app 155d1d3e), then security posture (WAF/firewall, token scope), cost (D1 rows-read/write trends, KV op waste, Pages vs Workers fit), compliance (CORS, no cache on user-scoped routes). Every new CF best-practice standard lands as a cosmoflare audit rule first. Existing building blocks to compose, not rebuild: doctor (domain health), validate, limits catalog, alerts conditions. Naming conflict: 'cosmoflare audit' is the CLI mutation audit log today — the verdict command needs a non-colliding name or a subcommand. Program anchor: the roadmap pillar for CF governance (see linked ROAD item).

## Acceptance Criteria

- [ ] One command returns pass/fail with per-rule findings and --json
- [ ] Exit code is non-zero on fail for CI and scripts
- [ ] Caching rule set (FEAT-049) is the first rule set
- [ ] Rule framework lets a new standard land as a rule without a new command
- [ ] Command name does not collide with the audit log command


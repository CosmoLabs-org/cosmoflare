title: 'Ops rules_quota summary: stale/poisoned KV state presented as current; corrupt entry throw-loops cron in swallowed catches'
description: 'apps/ops/src/rules_quota.ts:301 summary path: aggregateSummary stamps generatedAt=read-time now over per-zone entries up to 48h old (validated store.at never exposed, no age field to client); store entries only shallow-validated — a corrupt entry makes aggregateSummary throw every cron cycle while readRulesQuotaSummary''s catch hides it as an empty summary; CURSOR_KEY read is the file''s only unguarded OPS_KV access; SUMMARY_KEY+CURSOR_KEY read-modify-write is non-atomic under overlapping cron invocations (429-slowed batch loses its merge, double-advances cursor). Found by max-effort review of the 2026-10-15 window (commit 5555936).'
fix_direction: Expose per-entry age (store.at) to the summary payload and stamp generatedAt from the newest entry; deep-validate store entries with per-entry skip (not cycle-throw); guard the cursor read like other OPS_KV accesses; make cursor+summary updates atomic (single key or write ordering).

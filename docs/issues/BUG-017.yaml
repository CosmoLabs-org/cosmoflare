title: Download progress bar never renders during transfer
description: ProgressWriter.Write calls Add() which only updates counters. FormatBar() is called once after io.Copy completes. Users see blank line during download.
fix_direction: In pkg/r2go2/download.go:Download(), add a time.Ticker goroutine that calls progressWriter.FormatBar() and writes to os.Stderr every 100ms during io.Copy. Stop ticker on copy completion.

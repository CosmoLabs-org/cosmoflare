title: sync lists only first 1000 objects; --delete destroys local files
description: ListRemoteObjects makes one ListObjects call with maxKeys=1000 and discards NextToken (cmd/sync.go:428-443). On >1000-object prefixes, sync down --delete treats objects 1001+ as absent from remote and deletes matching local files; sync up re-uploads everything past 1000 every run. Found by 2026-08-31 audit agent-2.
fix_direction: Loop on result.NextToken passing it as continuationToken, accumulating items. Test with a fake backend returning 2 pages.
affected_files:
    - cmd/sync.go

title: 'Ops Worker: cron and API cache share KV keys in incompatible formats; scheduled handler has no rejection catch'
description: 'Opus integration review 2026-10-09: scheduled.ts:23 writes ''d1-list''/''zones'' as {at,value} with no TTL while cache.ts cached() reads the same keys as {storedAt,value} -> storedAt undefined -> NaN age -> the API serves the cron''s entry as fresh forever. index.ts:104 ctx.waitUntil(runScheduled(env).then(...)) has no .catch, so a KV failure becomes an unhandled rejection with no audit line.'
fix_direction: Rename cron keys to cron:d1-list / cron:zones with expirationTtl 86400; add .catch that logs {cron:'alerts',error}. Tests for both.
affected_files:
    - apps/ops/src/scheduled.ts
    - apps/ops/src/index.ts

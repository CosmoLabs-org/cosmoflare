# Local-release configuration. CI is permanently disabled on this repo
# (all workflows disabled_manually) — releases are ALWAYS cut from the
# maintainer machine:
#
#   git tag vX.Y.Z && git push origin vX.Y.Z
#   goreleaser release --clean        # builds dist/ + checksums, never uploads
#   # assert the version stamp (must NOT print "dev"):
#   ./dist/cosmoflare_darwin_arm64_v8.0/cosmoflare --version
#   # upload (binary artifacts live in per-target dirs; #name sets asset name):
#   gh release create vX.Y.Z dist/checksums-sha256.txt \
#       $(jq -r '.[] | select(.type=="Binary" and (.name|startswith("cosmoflare-"))) | "\(.path)#\(.name)"' dist/artifacts.json) \
#       --notes "..."
#
# Asset surface matches v0.19.0: 5 bare binaries + checksums-sha256.txt.
version: 2

project_name: cosmoflare

builds:
  - id: cosmoflare
    main: .
    binary: cosmoflare
    dir: .
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/CosmoLabs-org/cosmoflare/cmd.AppVersion={{ .Version }}
      - -X github.com/CosmoLabs-org/cosmoflare/cmd.BuildTime={{ .Date }}
      - -X github.com/CosmoLabs-org/cosmoflare/cmd.GitCommit={{ .FullCommit }}

archives:
  - formats: [binary]
    # goreleaser appends .exe for windows automatically — do not add it here
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums-sha256.txt
  algorithm: sha256

# Publishing stays manual (gh release create) per the no-CI constitutional rule.
release:
  disable: true

# Changelogs are managed by ccs changelog, not git-log dumps.
changelog:
  disable: true

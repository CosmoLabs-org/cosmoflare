name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests before release
        run: go test -race -timeout 120s ./cmd/ ./pkg/cosmoflare/ ./internal/...

      - name: Set build metadata
        run: |
          echo "BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Cross-compile binaries
        run: |
          mkdir -p dist

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for platform in "${platforms[@]}"; do
            OS="${platform%/*}"
            ARCH="${platform#*/}"
            BINARY="cosmoflare-${OS}-${ARCH}"
            if [ "$OS" = "windows" ]; then
              BINARY="${BINARY}.exe"
            fi

            echo "Building ${BINARY}..."
            CGO_ENABLED=0 GOOS="$OS" GOARCH="$ARCH" go build \
              -ldflags "-s -w \
                -X github.com/CosmoLabs-org/cosmoflare/cmd.AppVersion=${VERSION} \
                -X github.com/CosmoLabs-org/cosmoflare/cmd.BuildTime=${BUILD_TIME} \
                -X github.com/CosmoLabs-org/cosmoflare/cmd.GitCommit=${GIT_COMMIT}" \
              -o "dist/${BINARY}" .
          done

          ls -lh dist/

      - name: Verify version stamping
        run: |
          STAMPED="$(./dist/cosmoflare-linux-amd64 --version)"
          echo "Reported: ${STAMPED}"
          echo "${STAMPED}" | grep -q "${VERSION}" || {
            echo "::error::version mismatch — binary reports '${STAMPED}', expected '${VERSION}' (ldflags -X target broken?)"
            exit 1
          }

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum cosmoflare-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Generate release notes
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "## Cosmoflare ${VERSION}"
            echo ""
            echo "### Installation"
            echo ""
            echo "Download the binary for your platform from the assets below, or install via Go:"
            echo ""
            echo '```bash'
            echo "go install github.com/CosmoLabs-org/cosmoflare@${VERSION}"
            echo '```'
            echo ""
            echo "### Changes"
            echo ""
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..HEAD"
            else
              git log --pretty=format:"- %s (%h)" --max-count=50
            fi
            echo ""
            echo ""
            echo "### Checksums"
            echo ""
            echo '```'
            cat dist/checksums-sha256.txt
            echo '```'
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/cosmoflare-*
            dist/checksums-sha256.txt
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

name: Test Suite
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  GO_VERSION_MATRIX: '["1.21", "1.22", "1.23"]'
  GO_VERSION_LATEST: "1.23"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: [1.21, 1.22, 1.23]
        exclude:
          # Exclude some combinations to reduce CI load while maintaining coverage
          - os: windows-latest
            go-version: 1.21
          - os: macos-latest
            go-version: 1.22

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-

    - name: Install dependencies
      run: go mod download

    - name: Run unit tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Run benchmarks
      run: go test -bench=. -benchmem ./...

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unit-tests
        name: codecov-umbrella

  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    needs: unit-tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION_LATEST }}

    - name: Install dependencies
      run: go mod download

    - name: Build binary
      run: go build -o r2go2 .

    - name: Run integration tests
      run: |
        # Test basic CLI functionality
        ./r2go2 --help
        ./r2go2 version
        # Run integration test suite
        go test -v -tags=integration ./tests/integration/...

    - name: Test installation
      run: |
        go install .
        r2go2 --help

  tui-tests:
    name: TUI Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION_LATEST }}

    - name: Install dependencies
      run: go mod download

    - name: Run TUI component tests
      run: go test -v -tags=tui ./tests/tui/...

    - name: Run accessibility tests
      run: go test -v -tags=accessibility ./tests/accessibility/...

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION_LATEST }}

    - name: Install dependencies
      run: go mod download

    - name: Run performance benchmarks
      run: go test -v -bench=. -benchmem -run=^$ ./tests/performance/... -count=3

    - name: Memory leak detection
      run: |
        # Run with race detector and memory profiling
        go test -race -memprofile=mem.prof -timeout=30m ./tests/performance/...
        go tool pprof -text mem.prof > memory-report.txt
        cat memory-report.txt

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION_LATEST }}

    - name: Install dependencies
      run: go mod download

    - name: Run Gosec security scanner
      uses: securecodewarrior/github-action-gosec@master
      with:
        args: '-fmt sarif -out gosec.sarif ./...'

    - name: Upload Gosec results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: gosec.sarif

    - name: Run security tests
      run: go test -v -tags=security ./tests/security/...

  cross-platform-build:
    name: Cross-Platform Build
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION_LATEST }}

    - name: Install dependencies
      run: go mod download

    - name: Build for multiple platforms
      run: |
        # Build for different OS/architecture combinations
        GOOS=linux GOARCH=amd64 go build -o r2go2-linux-amd64 .
        GOOS=linux GOARCH=arm64 go build -o r2go2-linux-arm64 .
        GOOS=darwin GOARCH=amd64 go build -o r2go2-darwin-amd64 .
        GOOS=darwin GOARCH=arm64 go build -o r2go2-darwin-arm64 .
        GOOS=windows GOARCH=amd64 go build -o r2go2-windows-amd64.exe .

    - name: Verify builds
      run: |
        file r2go2-* | grep -E "(executable|binary)"
        ls -la r2go2-*

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, tui-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION_LATEST }}

    - name: Install dependencies
      run: go mod download

    - name: Generate coverage report
      run: |
        go test -coverprofile=coverage.out ./...
        go tool cover -html=coverage.out -o coverage.html
        go tool cover -func=coverage.out > coverage.txt

    - name: Check coverage thresholds
      run: |
        # Extract total coverage percentage
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${COVERAGE}%"

        # Require at least 70% coverage
        if (( $(echo "$COVERAGE < 70" | bc -l) )); then
          echo "Coverage ${COVERAGE}% is below required 70%"
          exit 1
        fi

        # Critical paths should have 95%+ coverage
        CRITICAL_COVERAGE=$(go test -coverprofile=critical.out ./internal/config/ ./internal/api/ ./internal/interactive/ 2>/dev/null | grep -o 'coverage: [0-9.]*%' | head -1 | grep -o '[0-9.]*')
        echo "Critical path coverage: ${CRITICAL_COVERAGE}%"

        if (( $(echo "$CRITICAL_COVERAGE < 95" | bc -l) )); then
          echo "Critical path coverage ${CRITICAL_COVERAGE}% is below required 95%"
          exit 1
        fi

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report
        path: |
          coverage.out
          coverage.html
          coverage.txt

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, tui-tests, performance-tests, security-scan, cross-platform-build]

    steps:
    - name: Quality Gate Check
      run: |
        echo "✅ All tests passed!"
        echo "✅ Coverage thresholds met!"
        echo "✅ Security scan completed!"
        echo "✅ Cross-platform builds successful!"
        echo "✅ Performance benchmarks acceptable!"
        echo ""
        echo "🚀 R2Go2 is ready for production deployment!"
name: Test

on:
  pull_request:
    branches: [master]

env:
  GO_VERSION: "1.26"

jobs:
  test:
    name: Quick Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -timeout 120s ./cmd/ ./pkg/cosmoflare/ ./internal/...

      - name: Build
        run: go build -o cosmoflare .

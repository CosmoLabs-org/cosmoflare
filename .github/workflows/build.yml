name: Build and Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  GO_VERSION: "1.26"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: |
          go mod download
          go mod tidy

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run tests with coverage
        run: |
          go tool cover -html=coverage.out -o coverage.html
          go tool cover -func=coverage.out

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Gosec Security Scanner
        uses: securecodewarrior/github-action-gosec@master
        with:
          args: './...'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64, linux/armv7, windows/amd64, windows/arm64, darwin/amd64, darwin/arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get version
        id: version
        run: |
          if [[ ${{ github.ref_type }} == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Set build variables
        run: |
          echo "BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')" >> $GITHUB_ENV
          echo "GIT_COMMIT=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build binary
        env:
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.platform }}
        run: |
          # Extract OS and ARCH from platform string
          OS=$(echo ${{ matrix.platform }} | cut -d'/' -f1)
          ARCH=$(echo ${{ matrix.platform }} | cut -d'/' -f2)

          # Set GOOS and GOARCH properly
          export GOOS=$OS
          export GOARCH=$ARCH

          BINARY_NAME="r2go2-$OS-$ARCH"
          if [ "$OS" = "windows" ]; then
            BINARY_NAME="$BINARY_NAME.exe"
          fi

          echo "Building for $OS/$ARCH -> $BINARY_NAME"

          mkdir -p dist
          CGO_ENABLED=0 go build \
            -ldflags "-X github.com/CosmoLabs-org/CosmoDev-R2Go2/cmd.AppVersion=${{ steps.version.outputs.version }} \
                      -X github.com/CosmoLabs-org/CosmoDev-R2Go2/cmd.BuildTime=${{ env.BUILD_TIME }} \
                      -X github.com/CosmoLabs-org/CosmoDev-R2Go2/cmd.GitCommit=${{ env.GIT_COMMIT }}" \
            -o dist/$BINARY_NAME .

      - name: Create archives
        run: |
          OS=$(echo ${{ matrix.platform }} | cut -d'/' -f1)
          ARCH=$(echo ${{ matrix.platform }} | cut -d'/' -f2)

          cd dist
          BINARY_NAME="r2go2-$OS-$ARCH"
          if [ "$OS" = "windows" ]; then
            BINARY_NAME="$BINARY_NAME.exe"
            zip -r "r2go2-${{ steps.version.outputs.version }}-$OS-$ARCH.zip" $BINARY_NAME ../README.md ../LICENSE
          else
            tar -czf "r2go2-${{ steps.version.outputs.version }}-$OS-$ARCH.tar.gz" $BINARY_NAME ../README.md ../LICENSE
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r2go2-${{ matrix.platform }}
          path: dist/*
          retention-days: 30

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version
        id: version
        run: |
          if [[ ${{ github.ref_type }} == "tag" ]]; then
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "version=latest" >> $GITHUB_OUTPUT
          fi

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.title=R2Go2
            org.opencontainers.image.description=Cloudflare R2 CLI management tool
            org.opencontainers.image.url=https://github.com/CosmoLabs-org/CosmoDev-R2Go2
            org.opencontainers.image.source=https://github.com/CosmoLabs-org/CosmoDev-R2Go2
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          mkdir -p dist
          syft . -o cyclonedx-json > dist/sbom.cyclonedx.json
          syft . -o spdx-json > dist/sbom.spdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom.*
          retention-days: 30
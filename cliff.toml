# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
# changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version -%}
    ## [{{ version | replace(from="v", to="") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        {% if commit.breaking -%}
            - **BREAKING**: {{ commit.message | upper_first }}
                {% if commit.breaking_description is not none %}
                    {{ commit.breaking_description | indent(12) }}
                {% endif %}
                {% if commit.scopes | length == 1 %}
                    ({{ commit.scopes[0] }})
                {% elif commit.scopes | length > 1 %}
                    ({{ commit.scopes | join(sep=", ") }})
                {% endif %}
        {% else -%}
            - {{ commit.message | upper_first }}
                {% if commit.scopes | length == 1 %}
                    ({{ commit.scopes[0] }})
                {% elif commit.scopes | length > 1 %}
                    ({{ commit.scopes | join(sep=", ") }})
                {% endif %}
        {% endif %}
    {% endfor %}
{% endfor %}

{% if previous %}
    {% if previous.version -%}
        {% if previous.commit_id %}
            [{{ previous.version | replace(from="v", to="") }}]: https://github.com/CosmoLabs-org/CosmoDev-R2Go2/compare/{{ previous.commit_id }}...{{ commit_id }}
        {% else %}
            [{{ previous.version | replace(from="v", to="") }}]: https://github.com/CosmoLabs-org/CosmoDev-R2Go2/releases/tag/{{ previous.version }}
        {% endif %}
    {% endif %}
{% endif %}
"""
# remove the leading and trailing whitespace from the template
trim = true
# changelog footer
footer = """
<!-- generated by git-cliff -->
"""

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# regex for parsing and grouping commits
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = "^style", group = "Changed" },
    { message = "^rfe", group = "Changed" },
    { message = "^revert", group = "Changed" },
    { message = "^test", group = "Changed", skip = true },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore", group = "Changed", skip = true },
    { message = "^ci", group = "Changed", skip = true },
    { message = "^doc", group = "Changed", skip = true },
    { message = "^docs", group = "Changed", skip = true },
    { message = "^build", group = "Changed", skip = true },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false
# filter out the commits that are not matched by commit parsers
filter_commits = false
# regex for matching git tags
tag_pattern = "v[0-9]*"
# regex for skipping tags
skip_tags = "v0.0.0"
# regex for ignoring tags
ignore_tags = ""
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"
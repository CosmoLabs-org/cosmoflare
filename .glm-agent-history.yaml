    - id: "0002"
      task: "Fix UTF-8 character counting in tests/tui/components/dashboard/view_test.go.\n\nProblem: len() returns byte count (3) for UTF-8 chars like █ and ░ instead of rune count (1).\n\nStep-by-step changes:\n1. Add \"unicode/utf8\" to the import block\n2. Line 175: Change len(char) to utf8.RuneCountInString(char)\n3. Line 189: Change len(pattern) to utf8.RuneCountInString(pattern)  \n4. Fix progress patterns (lines 181-184) to all be exactly 20 runes:\n   - Line 181: keep as-is (1 █ + 19 ░ = 20) \n   - Line 182: change to \"████████████████████\" (20 █ chars)\n   - Line 183: change to \"██████████░░░░░░░░░░\" (10 █ + 10 ░ = 20)\n   - Line 184: change to \"░░░░░░░░░░░░░░░░░░░░\" (20 ░ chars)\n5. Fix progress pattern assertions (lines 190-191): Not all patterns contain both chars. Replace the two assert.Contains lines with conditional checks:\n   if utf8.RuneCountInString(strings.ReplaceAll(pattern, \"░\", \"\")) > 0 {\n     assert.Contains(t, pattern, \"█\", \"Should contain filled characters\")\n   }\n   if utf8.RuneCountInString(strings.ReplaceAll(pattern, \"█\", \"\")) > 0 {\n     assert.Contains(t, pattern, \"░\", \"Should contain empty characters\")  \n   }\n   Add \"strings\" to imports if not already present.\n\nVerify: go test -run TestViewRendering ./tests/tui/components/dashboard/"

    - id: "0003"
      task: |-
        Fix platform-specific permission test in tests/platform/cross_platform_test.go.

        Problem: On macOS, /root/ doesn't exist (returns 'no such file or directory' not 'permission denied'). The test at line 273 uses /root/ for both darwin and linux.

        Fix: Replace the 'darwin', 'linux' case (lines 272-273) with separate cases:
        case "darwin":
            restrictedDir := filepath.Join(t.TempDir(), "restricted")
            os.Mkdir(restrictedDir, 0000)
            restrictedPath = restrictedDir
        case "linux":
            restrictedPath = "/root/"

        Add "path/filepath" to imports if not already present.
        The os.Mkdir with 0000 perms creates a directory that exists but denies access.

        Verify: go test -run TestErrorHandling ./tests/platform/
      started: 2026-02-26T01:54:49.454579+01:00
      completed: 2026-02-26T02:03:49.218924+01:00
